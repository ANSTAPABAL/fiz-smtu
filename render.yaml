services:
  - type: web
    name: fiz-smtu
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: APP_USERNAME
        value: fizruk
      - key: APP_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
