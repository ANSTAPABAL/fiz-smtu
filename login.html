<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — ФКиС СПбГМТУ</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <style>
    body{min-height:100vh;display:grid;place-items:center;background:#f4f6f8}
    .login-card{width:min(460px,calc(100% - 32px));padding:36px;background:#fff;border:1px solid #d9e2f0;border-top:5px solid #ef4d12;box-shadow:0 16px 50px #273a551c}
    .login-mark{width:58px;height:6px;background:#ef4d12;margin-bottom:26px}
    .login-card h1{margin:0 0 10px;color:#455273;font-family:Georgia,serif;font-size:34px}
    .login-card p{margin:0 0 28px;color:#687789}
    .login-card label{display:block;margin:16px 0 7px;color:#455273;font-weight:600}
    .login-card input{box-sizing:border-box;width:100%;min-height:48px;padding:10px 13px;border:1px solid #d9e2f0;font:inherit}
    .login-card button{width:100%;margin-top:24px;min-height:50px;border:0;background:#517cb3;color:white;font:inherit;font-weight:700;cursor:pointer}
    .login-error{min-height:24px;margin-top:12px;color:#bd3e24}
  </style>
</head>
<body>
  <main class="login-card">
    <div class="login-mark"></div>
    <h1>ФКиС СПбГМТУ</h1>
    <p>Войдите в демонстрационный контур учёта</p>
    <form id="login-form">
      <label for="username">Логин</label>
      <input id="username" name="username" autocomplete="username" required>
      <label for="password">Пароль</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Войти</button>
      <div class="login-error" id="login-error" role="alert"></div>
    </form>
  </main>
  <script>
    document.querySelector('#login-form').addEventListener('submit', async event => {
      event.preventDefault();
      const form = new FormData(event.currentTarget);
      const response = await fetch('/api/login', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(form))});
      const result = await response.json();
      if (response.ok) location.assign('/');
      else document.querySelector('#login-error').textContent = result.error || 'Не удалось войти.';
    });
  </script>
</body>
</html>
